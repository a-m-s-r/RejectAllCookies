<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimum Consent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Minimum Consent</h1>
      <label class="setting"
        ><span>Automatic rejection</span><input id="enabled" type="checkbox"
      /></label>
      <label class="setting"
        ><span>Pause on this site</span><input id="paused" type="checkbox" disabled
      /></label>
      <p id="site">No page access</p>
      <p id="status" role="status">No consent result recorded.</p>
      <button id="report-modal" type="button">Report and hide a missed consent modal</button>
      <section id="reports" hidden>
        <h2>Reported modals</h2>
        <p id="report-count"></p>
        <button id="export-reports" type="button">Export report log</button>
        <ul id="report-list"></ul>
      </section>
      <details id="diagnostics" hidden>
        <summary>Local diagnostic details</summary>
        <pre id="diagnostic-text"></pre>
      </details>
      <button id="manage-sites" type="button">Manage paused sites</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
